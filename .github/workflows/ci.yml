name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-ci:
    permissions:
      contents: read
    uses: kevinklaes/shared-actions/.github/workflows/python-ci.yml@v1.1.0
    with:
      runs-on: ${{ vars.CI_RUNS_ON || '"ubuntu-slim"' }}
      installer: uv
      python-version: "3.13"
      lint-command: >-
        python -c "import json; json.load(open('custom_components/orion_sleep/manifest.json')); json.load(open('hacs.json'))"
        && python -m py_compile custom_components/orion_sleep/*.py
        && python -c "import orion_info"
      test-command: pytest
